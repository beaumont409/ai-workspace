<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>O.E.M. Unlocks</title>    <style>
        :root { --bg: #0a0a0a; --card: #141414; --accent: #c6ff1a; --text: #ffffff; --text-dim: #888; --line: #222; }        body{ background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }      header { text-align: center; margin-bottom: 40px; }
        .logo {font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
        .container { max-width: 600px; margin: 0 auto; }
        .service-card { background: var(--card); border: 1px solid var(--line); padding: 24px; border-radius: 12px; margin-bottom: 16px; }    .service-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }     .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
        .usd-price { font-size: 24px; font-weight: 700; color: var(--accent); }  .btc-price { font-size: 14px; color: var(--text-dim); }
        .buy-btn { width: 100%; padding: 14px; background: var(--accent); color:#000; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: transform 0.2s; }       .buy-btn:active { transform: scale(0.98); }
    
/* OEM button visibility update */
*, *::before, *::after {
    box-sizing: border-box;
}
.price-row {
    flex-wrap: wrap;
}
.buy-btn {
    display: block;
    min-height: 56px;
    padding: 18px 20px;
    border: 2px solid #e2ff8a;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 0 #719600, 0 0 20px #c6ff1a26;
}
.buy-btn:hover {
    background: #daff70;
}
.buy-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 5px;
}
.service-card {
    border-color: #3b4725;
}

</style>
</head>
<body>
    <div class="container">   <header>
            <div class="logo">O.E.M. UNLOCKS</div>    <p style="color: var(--text-dim)">Fast, secure, and permanent device unlocking.</p>
        </header>

        <div class="service-card">           <div class="service-name">Bootloader Unlock</div>  <div class="price-row">           <span class="usd-price">$45.00</span>           <span class="btc-price">≈ <span id="btc-bootloader">---</span> BTC</span>
            </div>
            <button class="buy-btn" onclick="location.href='payment.php?service=bootloader'">BUY NOW</button>
        </div>

        <div class="service-card">
            <div class="service-name">FRP Removal</div>           <div class="price-row">
                <span class="usd-price">$30.00</span>
                <span class="btc-price">≈ <span id="btc-frp">---</span> BTC</span>      </div>
            <button class="buy-btn" onclick="location.href='payment.php?service=frp'">BUY NOW</button>
        </div>

        <footer style="text-align: center; margin-top: 40px; color: var(--text-dim); font-size: 12px;">      &copy; 2026 O.E.M. Unlocks. All rights reserved.
        </footer></div>

    <script>
        async function updateBTC() {
            try {
                const response = await fetch('https://api.coindesk.com/v1/bpi/currentprice.json');  const data = await response.json();            const btcPrice = data.bpi.USD.rate_float;// Calculate BTC amounts
                const bootloaderBTC = (45.00 / btcPrice).toFixed(6);       const frpBTC = (30.00 / btcPrice).toFixed(6);

                // Update the UI
                document.getElementById('btc-bootloader').textContent= bootloaderBTC;
                document.getElementById('btc-frp').textContent = frpBTC;
            } catch (err) {
                console.error("Failed to fetch BTC price", err); }
        } // Run once on load, then every 60 seconds
        updateBTC();
        setInterval(updateBTC, 60000);
    </script>
</body>
</html>
