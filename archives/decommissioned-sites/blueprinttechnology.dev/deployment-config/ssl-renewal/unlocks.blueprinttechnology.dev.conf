# renew_before_expiry = 30 days
version = 2.9.0
archive_dir = /etc/letsencrypt/archive/unlocks.blueprinttechnology.dev
cert = /etc/letsencrypt/live/unlocks.blueprinttechnology.dev/cert.pem
privkey = /etc/letsencrypt/live/unlocks.blueprinttechnology.dev/privkey.pem
chain = /etc/letsencrypt/live/unlocks.blueprinttechnology.dev/chain.pem
fullchain = /etc/letsencrypt/live/unlocks.blueprinttechnology.dev/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = [REDACTED_ACCOUNT_ID]
authenticator = nginx
installer = nginx
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
