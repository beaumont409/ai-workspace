<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">O.E.M. Unlocks illuminated glass cube</title>
  <desc id="desc">A precision-machined dark chrome cube with beveled smoked glass, a luminous open-lock emblem, and a soft reflection on a black surface.</desc>
  <defs>
    <linearGradient id="metalFace" x1="170" y1="140" x2="540" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222926"/><stop offset=".1" stop-color="#0c100e"/><stop offset=".52" stop-color="#141a17"/><stop offset=".82" stop-color="#050706"/><stop offset="1" stop-color="#29312d"/>
    </linearGradient>
    <linearGradient id="metalTop" x1="260" y1="90" x2="520" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5bfba"/><stop offset=".08" stop-color="#46504b"/><stop offset=".22" stop-color="#111614"/><stop offset=".74" stop-color="#303a35"/><stop offset="1" stop-color="#9aa59f"/>
    </linearGradient>
    <linearGradient id="metalSide" x1="510" y1="150" x2="610" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2d8d5"/><stop offset=".055" stop-color="#57615c"/><stop offset=".18" stop-color="#151b18"/><stop offset=".64" stop-color="#080b09"/><stop offset=".88" stop-color="#2a322e"/><stop offset="1" stop-color="#0b0e0c"/>
    </linearGradient>
    <linearGradient id="bezel" x1="180" y1="160" x2="510" y2="545" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7ddda"/><stop offset=".035" stop-color="#727d77"/><stop offset=".075" stop-color="#1a201d"/><stop offset=".22" stop-color="#080b09"/><stop offset=".75" stop-color="#101512"/><stop offset=".94" stop-color="#050706"/><stop offset=".985" stop-color="#a3ada7"/><stop offset="1" stop-color="#252d29"/>
    </linearGradient>
    <linearGradient id="glass" x1="230" y1="190" x2="470" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4e6156" stop-opacity=".67"/><stop offset=".13" stop-color="#18231d" stop-opacity=".88"/><stop offset=".53" stop-color="#0a100c" stop-opacity=".94"/><stop offset=".84" stop-color="#101b14" stop-opacity=".89"/><stop offset="1" stop-color="#3e5547" stop-opacity=".77"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="220" y1="183" x2="498" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".25"/><stop offset=".11" stop-color="#e5f3e9" stop-opacity=".07"/><stop offset=".34" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#b7ecc2" stop-opacity=".025"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="190" y1="215" x2="510" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ffad" stop-opacity=".85"/><stop offset=".18" stop-color="#74c72c" stop-opacity=".34"/><stop offset=".5" stop-color="#91f13c" stop-opacity=".08"/><stop offset=".83" stop-color="#b8ff68" stop-opacity=".34"/><stop offset="1" stop-color="#efffe1" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="floor" x1="390" y1="526" x2="390" y2="655" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66776b" stop-opacity=".22"/><stop offset=".22" stop-color="#26352b" stop-opacity=".14"/><stop offset="1" stop-color="#070a08" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreLight" cx="0" cy="0" r="1" gradientTransform="matrix(1 0 0 1 350 338)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bdff69" stop-opacity=".22"/><stop offset=".28" stop-color="#5bd025" stop-opacity=".12"/><stop offset="1" stop-color="#48aa29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 82 -270 0 390 550)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79d83c" stop-opacity=".2"/><stop offset="1" stop-color="#2e7c35" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="68" y="500" width="665" height="144" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="0" y="0" width="800" height="680" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="greenBloom" x="257" y="238" width="196" height="214" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="metalShine" x="0" y="0" width="800" height="680" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="frontGlass"><rect x="194" y="180" width="312" height="356" rx="12"/></clipPath>
    <linearGradient id="fadeReflection" x1="0" y1="530" x2="0" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".7"/><stop offset=".4" stop-color="white" stop-opacity=".28"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectionMask"><rect width="800" height="680" fill="url(#fadeReflection)"/></mask>
    <g id="cube">
      <!-- polished top and right planes -->
      <path d="M180 164 250 101h359l-82 63H180Z" fill="url(#metalTop)" stroke="#d0d8d3" stroke-opacity=".5" stroke-width="1.5"/>
      <path d="m507 164 102-63v358l-102 91V164Z" fill="url(#metalSide)" stroke="#dce2df" stroke-opacity=".44" stroke-width="1.5"/>
      <path d="m196 155 54-43h328l-69 43H196Z" stroke="#f4f8f6" stroke-opacity=".18" stroke-width="1"/>
      <path d="m521 173 79-49v328l-79 68V173Z" stroke="#f3f7f5" stroke-opacity=".13" stroke-width="1"/>
      <path d="m535 192 58-37v289l-58 48V192Z" fill="#020403" fill-opacity=".27"/>
      <path d="m540 199 3-2v287l-3 2z" fill="#dbe3de" fill-opacity=".43"/>
      <path d="m601 150 5-3v307l-5 4z" fill="#080b09" fill-opacity=".6"/>
      <path d="M258 113h325" stroke="#fff" stroke-opacity=".24"/>
      <path d="M253 120h310" stroke="#fff" stroke-opacity=".08"/>
      <!-- dark machined front shell -->
      <rect x="160" y="148" width="370" height="410" rx="29" fill="url(#bezel)" stroke="#cbd3ce" stroke-opacity=".64" stroke-width="1.3"/>
      <rect x="164" y="152" width="362" height="402" rx="26" stroke="#050706" stroke-width="2"/>
      <path d="M181 154h309" stroke="#f1f4f2" stroke-opacity=".44" stroke-width="1.5"/>
      <path d="M170 180v330" stroke="#dfe5e1" stroke-opacity=".2" stroke-width="1"/>
      <path d="M519 194v320" stroke="#d6ddd9" stroke-opacity=".42" stroke-width="1.2"/>
      <!-- front smoked-glass insert -->
      <rect x="184" y="171" width="322" height="365" rx="17" fill="#050806" stroke="#030504" stroke-width="3"/>
      <rect x="194" y="180" width="312" height="356" rx="12" fill="url(#glass)" stroke="url(#edgeGlow)" stroke-opacity=".66" stroke-width="1.4"/>
      <g clip-path="url(#frontGlass)">
        <rect x="194" y="180" width="312" height="356" fill="url(#glassSheen)"/>
        <path d="m193 183 98-3-88 150-9-2z" fill="#fff" fill-opacity=".045"/>
        <path d="m472 179 34 1v356h-15l10-240z" fill="#c4e6ca" fill-opacity=".045"/>
        <path d="M202 191h294" stroke="#fff" stroke-opacity=".31" stroke-width="1.2"/>
        <path d="M202 195h294" stroke="#effff1" stroke-opacity=".08"/>
        <path d="M203 523h291" stroke="#d4ffe0" stroke-opacity=".15"/>
        <ellipse cx="350" cy="338" rx="106" ry="124" fill="url(#coreLight)"/>
        <path d="m205 237 287 0" stroke="#d7eed9" stroke-opacity=".06"/>
        <path d="M211 450h278" stroke="#d7eed9" stroke-opacity=".055"/>
      </g>
      <rect x="194.7" y="180.7" width="310.6" height="354.6" rx="11.5" stroke="#d6f4dc" stroke-opacity=".24" stroke-width=".8"/>
      <!-- internal light core, held close to the glass -->
      <g filter="url(#greenBloom)" opacity=".65">
        <path d="M327 320v-19a23 23 0 0 1 46 0v11" stroke="#75ff2e" stroke-width="10" stroke-linecap="round"/>
        <rect x="315" y="316" width="72" height="62" rx="13" fill="#62fa24"/>
      </g>
      <!-- inset lock mark -->
      <path d="M329 321v-18a21 21 0 0 1 42 0v11" stroke="#baff6b" stroke-opacity=".27" stroke-width="15" stroke-linecap="round" filter="url(#soft)"/>
      <path d="M329 321v-18a21 21 0 0 1 42 0v11" stroke="url(#edgeGlow)" stroke-width="6" stroke-linecap="round"/>
      <rect x="316" y="317" width="69" height="59" rx="12" fill="#a5f441" fill-opacity=".19" stroke="#c4ff79" stroke-width="1.3"/>
      <rect x="321" y="322" width="59" height="49" rx="9" fill="url(#glass)" stroke="#e1ffbe" stroke-opacity=".62" stroke-width=".8"/>
      <circle cx="350.5" cy="343" r="5" fill="#e3ffb0"/>
      <path d="M349 346h3l2 11h-7l2-11Z" fill="#d7ffa0"/>
      <path d="M325 326h52" stroke="#f2ffe2" stroke-opacity=".37" stroke-width=".8"/>
      <!-- fine engraving and typography -->
      <text x="226" y="220" fill="#b8c6bb" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2.1">O.E.M. / 7T</text>
      <circle cx="434" cy="217" r="2" fill="#a8ff20"/>
      <text x="443" y="220" fill="#c8d3cb" font-family="Segoe UI,Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SYSTEM READY</text>
      <path d="M226 226h280" stroke="#d9eadb" stroke-opacity=".12"/>
      <text x="350" y="398" text-anchor="middle" fill="#f0f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="2.5">UNLOCK</text>
      <text x="350" y="411" text-anchor="middle" fill="#e0e8e1" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2.5">YOUR</text>
      <text x="350" y="424" text-anchor="middle" fill="#e0e8e1" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2.5">HARDWARE</text>
      <text x="350" y="451" text-anchor="middle" fill="#f0f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4.8">O.E.M.</text>
      <text x="350" y="471" text-anchor="middle" fill="#b1ff55" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="4.8">UNLOCKS7T</text>
      <path d="M298 484h104" stroke="#c6f0c9" stroke-opacity=".19"/>
      <path d="M335 484h30" stroke="#a8ff20" stroke-opacity=".74" stroke-width="1.2"/>
      <text x="350" y="504" text-anchor="middle" fill="#89968c" font-family="ui-monospace,Menlo,monospace" font-size="7" letter-spacing="2">DEVICE / ACCESS</text>
      <text x="212" y="524" fill="#a4b1a7" font-family="ui-monospace,Menlo,monospace" font-size="6.5" letter-spacing="1.5">SECURE REVIEW</text>
      <text x="488" y="524" text-anchor="end" fill="#a4b1a7" font-family="ui-monospace,Menlo,monospace" font-size="6.5" letter-spacing="1.2">01 — 02</text>
      <!-- micro fasteners -->
      <g fill="#080b09" stroke="#bbc4bf" stroke-opacity=".63" stroke-width=".8">
        <circle cx="177" cy="165" r="3.1"/><circle cx="513" cy="165" r="3.1"/>
        <circle cx="177" cy="539" r="3.1"/><circle cx="513" cy="539" r="3.1"/>
      </g>
      <g stroke="#d4ddd7" stroke-opacity=".59" stroke-width=".7">
        <path d="m175 165 4 0"/><path d="m511 165 4 0"/><path d="m175 539 4 0"/><path d="m511 539 4 0"/>
      </g>
      <!-- top and side glancing reflections -->
      <path d="m189 158 59-52" stroke="#fbfffd" stroke-opacity=".37" stroke-width="1.4"/>
      <path d="m523 160 76-47" stroke="#eff5f1" stroke-opacity=".23" stroke-width="1.2"/>
      <path d="m608 123v320" stroke="#eff6f1" stroke-opacity=".2" stroke-width="1"/>
      <path d="m527 536 73-66" stroke="#c9d4cd" stroke-opacity=".32" stroke-width="1.2"/>
      <path d="M195 550h302" stroke="#e3e9e5" stroke-opacity=".28"/>
      <path d="M214 555h250" stroke="#050706" stroke-opacity=".85" stroke-width="2"/>
    </g>
  </defs>

  <!-- black lacquer floor, soft contact shadow and restrained green bounce -->
  <ellipse cx="392" cy="559" rx="275" ry="52" fill="#000" opacity=".85" filter="url(#shadow)"/>
  <ellipse cx="390" cy="557" rx="235" ry="47" fill="url(#floorGlow)"/>
  <path d="M64 554h676v126H64z" fill="url(#floor)"/>
  <path d="M92 555c106-12 180-8 297 1 123 9 210 6 323-4" stroke="#b0c1b4" stroke-opacity=".09"/>
  <path d="M130 568c91-6 176-2 260 4 120 8 198 5 272-1" stroke="#fff" stroke-opacity=".035"/>
  <use href="#cube" transform="translate(0 1084) scale(1 -1)" opacity=".16" filter="url(#soft)" mask="url(#reflectionMask)"/>
  <use href="#cube"/>
  <path d="M192 542c74 10 210 12 315 0" stroke="#b9ff74" stroke-opacity=".22" stroke-width="2" filter="url(#metalShine)"/>
  <ellipse cx="362" cy="544" rx="132" ry="7" fill="#8bff38" fill-opacity=".11" filter="url(#soft)"/>
</svg>
